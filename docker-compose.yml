services:
  postgres:
    image: postgres:17-alpine
    container_name: craftsapiens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: craftsapiens
      POSTGRES_PASSWORD: craftsapiens_dev
      POSTGRES_DB: craftsapiens
    ports:
      # Só acessível pela própria máquina; o Postgres escuta na 5432 dentro do container
      - "127.0.0.1:5454:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
